# Builds LittleLotus.apk and attaches it to a GitHub release.
#
# Runs when a release is published, or by hand (Actions > Release APK > Run workflow) for a tag;
# run by hand, it creates the release on main if it doesn't exist yet. If
# .github/release-notes/<tag>.md exists, it becomes the release's notes.
# Signs with the app's own key, kept in two repository secrets:
#   ANDROID_KEYSTORE_B64       the keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
# Before uploading, the APK's signing certificate is compared with android/signing-cert.sha256,
# so an APK signed with any other key (which would not install over the app people have) is
# never published. The key changed in 1.1, after the 1.0 key was lost.
name: Release APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the APK for (e.g. v1.1); the release is created on main if missing
        required: true
        default: v1.1
      version_code:
        description: Android versionCode (must be higher than the last release's; 1.0 was 1)
        required: true
        default: "2"

permissions:
  contents: write

concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Work out the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          CODE_INPUT: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then echo "::error::Tag must look like v1.2"; exit 1; fi
          name="${TAG#v}"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if ! [[ "$CODE_INPUT" =~ ^[0-9]+$ ]]; then echo "::error::versionCode must be a number"; exit 1; fi
            code="$CODE_INPUT"
          else
            # Releases from v1.1 on: versionCode = major*100 + minor (1.1 -> 101 is higher than 1.0's 1).
            major="${name%%.*}"; minor="${name#*.}"; minor="${minor%%.*}"
            code=$(( major * 100 + minor ))
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building $TAG as versionName $name, versionCode $code"

      - name: Check the signing key is available
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Add the ANDROID_KEYSTORE_B64 and ANDROID_KEYSTORE_PASSWORD repository secrets first (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Create the release if it doesn't exist
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target main --title "Little Lotus ${TAG#v}" --notes "Little Lotus ${TAG#v}"
          fi
          git fetch --tags --force -q
          git checkout -q "$TAG"
          # The workflow's own files come from main, so a release made before them still gets its notes and key check.
          git checkout -q main -- .github android/signing-cert.sha256

      - name: Install the Android build tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq python3-pil rsync
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o "$RUNNER_TEMP/tools/bundletool.jar" https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar

      - name: Build and sign
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/littlelotus.keystore"
          JAVA_HOME="$JAVA_HOME_17_X64" ANDROID_SDK="$ANDROID_HOME" BUNDLETOOL="$RUNNER_TEMP/tools/bundletool.jar" \
            KEYSTORE="$RUNNER_TEMP/littlelotus.keystore" KS_PASS="$KS_PASS" \
            VERSION_CODE="${{ steps.version.outputs.code }}" VERSION_NAME="${{ steps.version.outputs.name }}" \
            ./android/build.sh
          rm -f "$RUNNER_TEMP/littlelotus.keystore"

      - name: Check it is signed with the app's key
        run: |
          set -euo pipefail
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          want=$(tr -d '[:space:]' < android/signing-cert.sha256)
          got=$("$signer" verify --print-certs android/out/LittleLotus.apk | grep -m1 'certificate SHA-256 digest' | awk '{print $NF}')
          echo "expected key: $want"; echo "APK key:      $got"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error::The APK is not signed with the app's key (android/signing-cert.sha256), so it would not install over the app people have. Nothing was uploaded."
            exit 1
          fi

      - name: Attach to the release
        run: |
          set -euo pipefail
          sha=$(sha256sum android/out/LittleLotus.apk | awk '{print $1}')
          gh release upload "$TAG" android/out/LittleLotus.apk --repo "$GITHUB_REPOSITORY" --clobber
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            sed "s/{{SHA256}}/$sha/" "$notes" > "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Little Lotus ${TAG#v}" --notes-file "$RUNNER_TEMP/notes.md" --latest
          fi
          echo "Attached LittleLotus.apk to $TAG. SHA-256: $sha" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 of LittleLotus.apk: $sha"
